name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Verify the installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          import emdb_schemas
          from emdb_schemas import emdb

          package_directory = Path(emdb_schemas.__file__).parent
          assert package_directory.joinpath("emdb.xsd").is_file()
          assert package_directory.joinpath("emdb_relaxed.xsd").is_file()
          assert emdb.__file__
          assert emdb.entry_type().version == version("emdb-schemas")
          PY
