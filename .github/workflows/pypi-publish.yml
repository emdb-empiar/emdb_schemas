name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify that the tag matches the package version
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          actual_version="$(python setup.py --version)"
          test "$expected_version" = "$actual_version"

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Verify the installed wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          import emdb_schemas
          from emdb_schemas import emdb

          package_directory = Path(emdb_schemas.__file__).parent
          assert package_directory.joinpath("emdb.xsd").is_file()
          assert package_directory.joinpath("emdb_relaxed.xsd").is_file()
          assert emdb.__file__
          assert emdb.entry_type().version == version("emdb-schemas")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
